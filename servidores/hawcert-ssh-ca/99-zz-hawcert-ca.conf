# HawCert: certificados SSH temporales de un solo uso para el usuario hawuser2026.
# Va el ÚLTIMO de /etc/ssh/sshd_config.d/ (el bloque Match dura hasta el final del fichero).
# El resto de usuarios y claves no se ven afectados.
Match User hawuser2026
    TrustedUserCAKeys /etc/ssh/hawcert/ca.pub
    AuthorizedPrincipalsCommand /usr/local/sbin/hawcert-principals %u %s %i %t %C
    AuthorizedPrincipalsCommandUser hawcertauth
